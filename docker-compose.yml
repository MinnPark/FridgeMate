services:
  backend:
    build: ./backend
    ports:
      - "8742:8742"
    env_file:
      - ./backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8742

  frontend:
    build: ./frontend/web
    ports:
      - "8743:8743"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8742
      - NEXT_PUBLIC_USE_MOCK_API=true
    depends_on:
      - backend
